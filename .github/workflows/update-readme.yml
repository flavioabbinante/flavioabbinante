name: Update README

on:
  schedule:
    # Ogni lunedi' alle 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/update_readme.py"
      - ".github/workflows/update-readme.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Checkout writeups
        uses: actions/checkout@v4
        with:
          repository: flavioabbinante/writeupctf
          path: writeupctf
          # Se writeupctf e' privato, genera un PAT con scope repo:read
          # e salvalo nei secrets del profile repo, poi decommenta:
          # token: ${{ secrets.WRITEUPS_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate README
        run: python tools/update_readme.py --writeups writeupctf --readme README.md

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "Niente da committare."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: aggiorna statistiche CTF nel README"
          git push
